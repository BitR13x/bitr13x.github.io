<nav class="navbar">
  <a class="navbar-brand" href="{{ '/' | relative_url }}">
    <span class="prompt">&gt;</span> @{{ site.author }}
  </a>
  <button class="navbar-toggle" id="navToggle" aria-label="Toggle navigation">menu</button>
  <ul class="navbar-links" id="navLinks">
    <li><a href="{{ '/' | relative_url }}" class="{% if page.nav == 'home' %}active{% endif %}">/Home</a></li>
    <li><a href="{{ '/articles/' | relative_url }}" class="{% if page.nav == 'blog' %}active{% endif %}">/Articles</a></li>
    <li><a href="{{ '/cheatsheet/' | relative_url }}" class="{% if page.nav == 'cheatsheet' %}active{% endif %}">/CheatSheet</a></li>
    <li><a href="{{ '/resources/' | relative_url }}" class="{% if page.nav == 'resources' %}active{% endif %}">/Resources</a></li>
    <li><a href="{{ '/about/' | relative_url }}" class="{% if page.nav == 'about' %}active{% endif %}">/About</a></li>
  </ul>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.getElementById('navToggle');
  var links = document.getElementById('navLinks');
  if (toggle && links) {
    toggle.addEventListener('click', function() { links.classList.toggle('open'); });
  }
});
</script>
