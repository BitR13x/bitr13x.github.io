---
layout: default
styles: /assets/css/page.css
---

<div class="container">
  <main class="page-main">
    {% if page.title %}
    <div class="page-header">
      <h1>~/<span class="acc">{{ page.slug | default: page.title | downcase | replace: ' ', '-' }}</span></h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
    {% endif %}
    <div class="page-content">
      {{ content }}
    </div>
  </main>
</div>
